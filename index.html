<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>A Little Gift for Her ♡</title>
  <style>
    :root {
      --pink: #f5b8c8;
      --deep-pink: #c85d82;
      --cream: #fff9ef;
      --yellow: #ffe6a4;
      --text: #674955;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Trebuchet MS", Arial, sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 15% 15%, #fff2c9 0, transparent 28%),
        radial-gradient(circle at 85% 80%, #f8cfdb 0, transparent 30%),
        linear-gradient(135deg, #fffaf4, #fdeaf0);
      overflow-x: hidden;
    }

    .page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 36px 18px;
      position: relative;
    }

    .card {
      width: min(100%, 650px);
      padding: 38px 24px;
      text-align: center;
      border: 1px solid #ffffffc9;
      border-radius: 30px;
      background: #ffffffa8;
      box-shadow: 0 18px 55px #bd78951c;
      backdrop-filter: blur(12px);
      position: relative;
      z-index: 2;
    }

    .eyebrow {
      color: var(--deep-pink);
      font-size: 12px;
      letter-spacing: 3px;
      text-transform: uppercase;
      font-weight: bold;
    }

    h1 {
      font-family: Georgia, serif;
      font-weight: normal;
      font-size: clamp(36px, 7vw, 58px);
      line-height: 1.1;
      margin: 15px 0 12px;
      color: #b95579;
    }

    .subtitle {
      max-width: 430px;
      margin: 0 auto;
      font-size: 15px;
      line-height: 1.8;
      color: #876773;
    }

    .gift-area {
      height: 235px;
      display: flex;
      align-items: center;
      justify-content: center;
      perspective: 800px;
      margin: 10px auto 0;
    }

    .gift {
      width: 150px;
      height: 125px;
      position: relative;
      margin-top: 55px;
      cursor: pointer;
      outline: none;
      -webkit-tap-highlight-color: transparent;
    }

    .gift-box {
      position: absolute;
      bottom: 0;
      width: 150px;
      height: 100px;
      border-radius: 7px 7px 13px 13px;
      background: linear-gradient(135deg, #f7b4c6, #ed8fac);
      box-shadow: 0 13px 20px #b9557925;
    }

    .ribbon {
      position: absolute;
      left: 61px;
      top: 0;
      width: 28px;
      height: 125px;
      background: #ffe9a6;
      z-index: 2;
    }

    .ribbon::before, .ribbon::after {
      content: "";
      position: absolute;
      width: 34px;
      height: 23px;
      border: 8px solid #ffe9a6;
      border-radius: 50% 50% 5px 50%;
      top: -25px;
    }

    .ribbon::before {
      left: -26px;
      transform: rotate(28deg);
    }

    .ribbon::after {
      right: -26px;
      transform: scaleX(-1) rotate(28deg);
    }

    .lid {
      position: absolute;
      top: -5px;
      left: -9px;
      width: 168px;
      height: 31px;
      border-radius: 8px;
      background: #f8c5d2;
      border: 2px solid #f4b0c3;
      z-index: 4;
      transform-origin: 10% 100%;
      transition: transform .85s cubic-bezier(.2,.8,.2,1);
    }

    .gift.open .lid {
      transform: translate(-12px, -48px) rotate(-28deg);
    }

    .gift.open .ribbon {
      opacity: .25;
    }

    .heart {
      position: absolute;
      z-index: 5;
      top: 28px;
      left: 61px;
      font-size: 28px;
      animation: heartbeat 1.6s infinite;
    }

    @keyframes heartbeat {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.14); }
    }

    .gift.open .heart {
      animation: pop .5s ease forwards;
    }

    @keyframes pop {
      to { transform: translateY(-80px) scale(1.7); opacity: 0; }
    }

    .tap-note {
      font-size: 12px;
      letter-spacing: 1px;
      color: #a77c8c;
      margin-top: -10px;
    }

    .message {
      display: none;
      margin: 25px auto 0;
      padding: 23px 20px;
      max-width: 490px;
      border-radius: 22px;
      background: #fff8ed;
      border: 1px solid #f8e2d0;
      animation: appear .7s ease both;
    }

    .message.show { display: block; }

    @keyframes appear {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .message h2 {
      margin: 0 0 12px;
      font-family: Georgia, serif;
      font-size: 25px;
      font-weight: normal;
      color: #bd5f81;
    }

    .message p {
      font-size: 15px;
      line-height: 1.9;
      margin: 0;
    }

    .buttons {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      margin-top: 22px;
    }

    button {
      border: none;
      padding: 12px 19px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: bold;
      font-family: inherit;
      cursor: pointer;
      transition: transform .2s, box-shadow .2s;
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 7px 15px #c85d8220;
    }

    .primary {
      background: #c85d82;
      color: white;
    }

    .secondary {
      background: white;
      color: #b95579;
      border: 1px solid #f1c5d3;
    }

    footer {
      font-size: 12px;
      color: #ad8996;
      margin-top: 30px;
      letter-spacing: .5px;
    }

    .petal {
      position: fixed;
      top: -30px;
      z-index: 1;
      pointer-events: none;
      animation: fall linear forwards;
      opacity: .75;
    }

    @keyframes fall {
      to {
        transform: translateY(110vh) rotate(540deg);
        opacity: .1;
      }
    }

    .sparkle {
      position: absolute;
      color: #e6b95f;
      font-size: 20px;
      animation: twinkle 2.5s infinite ease-in-out;
    }

    .s1 { top: 24%; left: 12%; }
    .s2 { top: 17%; right: 13%; animation-delay: .8s; }
    .s3 { bottom: 18%; left: 15%; animation-delay: 1.2s; }
    .s4 { bottom: 23%; right: 12%; animation-delay: .4s; }

    @keyframes twinkle {
      0%, 100% { opacity: .35; transform: scale(.8); }
      50% { opacity: 1; transform: scale(1.2); }
    }

    @media (max-width: 480px) {
      .card { padding: 32px 17px; }
      .gift-area { height: 220px; }
      .sparkle { font-size: 15px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .01ms !important;
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <span class="sparkle s1">✧</span>
    <span class="sparkle s2">✦</span>
    <span class="sparkle s3">✧</span>
    <span class="sparkle s4">✦</span>

    <section class="card">
      <div class="eyebrow">A little something for you ♡</div>
      <h1>A Little Gift<br>for Her</h1>
      <p class="subtitle">
        Gửi đến những người phụ nữ tuyệt vời một món quà nhỏ,
        cùng thật nhiều yêu thương trong ngày đặc biệt này.
      </p>

      <div class="gift-area">
        <div class="gift" id="gift" role="button" tabindex="0"
             aria-label="Mở hộp quà" aria-expanded="false">
          <div class="gift-box"></div>
          <div class="ribbon"></div>
          <div class="lid"></div>
          <div class="heart">♡</div>
        </div>
      </div>
      <p class="tap-note" id="tapNote">✿ CHẠM VÀO HỘP QUÀ ĐỂ MỞ ✿</p>

      <div class="message" id="message" aria-live="polite">
        <h2 id="greetingTitle">Happy Vietnamese Women's Day!</h2>
        <p id="greetingText"></p>
        <div class="buttons">
          <button class="primary" id="anotherBtn">Một lời chúc nữa ♡</button>
          <button class="secondary" id="flowerBtn">Thả thêm hoa ✿</button>
        </div>
      </div>

      <footer>20.10 · Made with love, just for you ♡</footer>
    </section>
  </main>

  <script>
    const greetings = [
      {
        title: "Gửi những người bà, người mẹ ♡",
        text: "Chúc bà, chúc mẹ luôn khỏe mạnh, bình an và có thật nhiều niềm vui. Mong rằng những hy sinh thầm lặng sẽ luôn được đáp lại bằng yêu thương, những cái ôm và thật nhiều ngày hạnh phúc."
      },
      {
        title: "Gửi những người cô giáo 🌷",
        text: "Chúc cô luôn giữ được nụ cười dịu dàng, trái tim ấm áp và niềm yêu nghề. Cảm ơn cô vì đã kiên nhẫn dìu dắt biết bao thế hệ học trò bằng cả sự tận tâm và yêu thương."
      },
      {
        title: "Gửi những cô gái đang cố gắng ✨",
        text: "Mong bạn luôn tin vào chính mình, kể cả trong những ngày mọi thứ chẳng dễ dàng. Bạn không cần phải hoàn hảo hay luôn mạnh mẽ. Hãy cứ bước đi theo nhịp độ của riêng mình và nhớ rằng bạn xứng đáng được yêu thương."
      },
      {
        title: "Gửi tất cả những người phụ nữ 💐",
        text: "Chúc bạn một ngày 20/10 thật dịu dàng, được lắng nghe, được trân trọng và được sống là chính mình. Mong cuộc sống sẽ dành cho bạn thật nhiều cơ hội, niềm vui và những điều tử tế."
      },
      {
        title: "Một lời chúc dành riêng cho bạn 💛",
        text: "Mong những điều tốt đẹp sẽ ghé thăm bạn theo cách thật tự nhiên. Chúc bạn luôn có đủ can đảm để theo đuổi ước mơ, đủ bình yên để tận hưởng hiện tại và đủ yêu thương để ôm lấy chính mình."
      }
    ];

    const gift = document.getElementById("gift");
    const message = document.getElementById("message");
    const tapNote = document.getElementById("tapNote");
    const title = document.getElementById("greetingTitle");
    const text = document.getElementById("greetingText");
    const anotherBtn = document.getElementById("anotherBtn");
    const flowerBtn = document.getElementById("flowerBtn");

    let lastGreeting = -1;
    let opened = false;

    function showGreeting() {
      let index;
      do {
        index = Math.floor(Math.random() * greetings.length);
      } while (index === lastGreeting && greetings.length > 1);

      lastGreeting = index;
      title.textContent = greetings[index].title;
      text.textContent = greetings[index].text;

      message.classList.remove("show");
      void message.offsetWidth;
      message.classList.add("show");
    }

    function openGift() {
      if (opened) return;
      opened = true;
      gift.classList.add("open");
      gift.setAttribute("aria-expanded", "true");
      tapNote.textContent = "MỘT MÓN QUÀ NHỎ, THẬT NHIỀU YÊU THƯƠNG ♡";
      showGreeting();
      message.classList.add("show");
      flowerRain(18);
    }

    gift.addEventListener("click", openGift);
    gift.addEventListener("keydown", function(event) {
      if (event.key === "Enter" || event.key === " ") {
        event.preventDefault();
        openGift();
      }
    });

    anotherBtn.addEventListener("click", showGreeting);
    flowerBtn.addEventListener("click", () => flowerRain(24));

    function flowerRain(amount) {
      const flowers = ["🌸", "🌷", "✿", "♡", "🌼"];
      for (let i = 0; i < amount; i++) {
        const petal = document.createElement("span");
        petal.className = "petal";
        petal.textContent = flowers[Math.floor(Math.random() * flowers.length)];
        petal.style.left = Math.random() * 100 + "vw";
        petal.style.fontSize = (12 + Math.random() * 15) + "px";
        const duration = 4 + Math.random() * 5;
        petal.style.animationDuration = duration + "s";
        document.body.appendChild(petal);
        setTimeout(() => petal.remove(), duration * 1000);
      }
    }
  </script>
</body>
</html>
